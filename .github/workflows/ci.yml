name: CI

# Gates (docs/ROADMAP.md item 1): tests for all three apps + lint for apps/ai
# (fully green). apps/api lint (80 ruff / 15 mypy) and the Flutter analyzer
# (366 infos) are RED AT BASELINE — they run as informational steps
# (continue-on-error) until the dedicated cleanup pass, so CI is meaningful
# from day one instead of permanently red.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai:
    name: apps/ai — pytest + ruff + mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      # setup-uv stopped publishing floating major tags in v8 — pin exactly.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy src

  api:
    name: apps/api — pytest (lint informational)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: ruff (informational — red baseline, see docs/ROADMAP.md)
        run: uv run ruff check .
        continue-on-error: true
      - name: mypy (informational — red baseline, see docs/ROADMAP.md)
        run: uv run mypy src
        continue-on-error: true

  app:
    name: apps/app — flutter test (analyze informational)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      # Reads the FVM pin so CI can never drift from local (`apps/app/.fvmrc`).
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: apps/app/.fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: analyze (informational — 366-info baseline, see docs/ROADMAP.md)
        run: flutter analyze
        continue-on-error: true
