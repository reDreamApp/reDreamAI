# reDreamAI overrides for the official self-hosted Supabase stack.
# infra/bootstrap.sh copies this file to /srv/supabase and enables it with
# `sh run.sh config add redream`.
#
# Nothing of Supabase listens on a public interface. The only way in from
# outside is Caddy in the reDreamAI stack, which forwards the auth and
# signed-storage paths and nothing else (infra/caddy/Caddyfile).
#
# Studio: ssh -L 8000:127.0.0.1:8000 root@<box>, then http://localhost:8000
# (user and password: DASHBOARD_USERNAME / DASHBOARD_PASSWORD in /srv/supabase/.env).

services:
  api-gw:
    ports: !override
      - 127.0.0.1:8000:8000/tcp

  # Containers reach the pooler inside the network; the host does not need it.
  supavisor:
    ports: !reset []

  # Postgres on loopback for `supabase db push` (bootstrap and deploy workflow).
  db:
    ports:
      - 127.0.0.1:54322:5432
