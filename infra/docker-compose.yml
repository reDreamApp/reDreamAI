# reDreamAI production stack — Scaleway target.
#
# What's here:
#   - caddy            : reverse proxy, TLS via Let's Encrypt, SSE-friendly
#   - api              : backend (apps/api), connects to Supabase Postgres
#   - ai               : AI service (apps/ai), stateless
#   - langfuse         : self-hosted Langfuse v2 (ADR 0007)
#
# What's deliberately NOT here (ADR 0001 — one Postgres):
#   - db: app database == self-hosted Supabase's Postgres. Supabase runs in
#     its own compose stack on the same Scaleway box. We attach to its
#     external network ("supabase") to reach the Postgres + Kong gateway.
#
# Env files (gitignored, deployed to /srv/redreamai/infra/env/ on the server):
#   env/ai.env, env/api.env, env/caddy.env, env/langfuse.env
# Templates live in infra/env.example/.

name: redreamai

services:
  caddy:
    image: caddy:2.8-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - ./env/caddy.env
    depends_on:
      - api
      - ai
      - langfuse

  ai:
    build:
      context: ../apps/ai
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./env/ai.env
    expose:
      - "8080"
    networks:
      - default
      - supabase

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./env/api.env
    environment:
      AI_SERVICE_URL: http://ai:8080
      LANGFUSE_HOST: http://langfuse:3000
    expose:
      - "8001"
    networks:
      - default
      - supabase
    depends_on:
      - ai

  langfuse:
    image: langfuse/langfuse:2
    restart: always
    env_file:
      - ./env/langfuse.env
    expose:
      - "3000"
    networks:
      - default
      - supabase

volumes:
  caddy_data:
  caddy_config:

networks:
  supabase:
    external: true
    # Created by the self-hosted Supabase compose stack. We attach to it so
    # api / ai can resolve supabase-db (Postgres) and kong (REST gateway).
    # Adjust the name if your Supabase install uses a different network name.
