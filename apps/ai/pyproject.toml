[project]
name = "redream-ai"
version = "0.1.0"
description = "reDreamAI: stateless IRT chatbot + crisis classifier + Voxtral audio."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "mistralai>=1.2,<2",
    "httpx>=0.27",
    "python-multipart>=0.0.20",
    "supabase>=2.10",
    # Pinned to v2 — the SDK is version-coupled to the self-hosted server
    # (ADR 0007 / infra compose run langfuse/langfuse:2). The v3+ SDK ingests
    # over an OTel endpoint the v2 server does not expose, so traces silently
    # drop. If the server is upgraded to v3+, bump this and update observability.py.
    "langfuse>=2.60,<3",
    # Ported IRT chatbot core (redream_ai/core, redream_ai/clinical_safety):
    # OpenAI-compatible SDK drives Scaleway (primary) + direct Mistral (fallback);
    # groq SDK is referenced by the registry but unused at runtime; networkx builds
    # the clinical knowledge graph; tiktoken is the streaming token estimate.
    "openai>=1.40",
    "groq>=0.11",
    "networkx>=3.2",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redream_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

# Langfuse v2 ships no py.typed marker; the SDK is confined to observability.py.
[[tool.mypy.overrides]]
module = ["langfuse.*"]
ignore_missing_imports = true
