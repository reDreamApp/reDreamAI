name: redream_app
description: "reDreamAI — IRT self-help for nightmares"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.1
  http: ^1.4.0
  provider: ^6.1.5
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.3
  intl: any
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  introduction_screen: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.0.0
  mockito: ^5.4.6
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/
