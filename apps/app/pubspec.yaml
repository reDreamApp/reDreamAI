name: redream_app
description: "reDreamAI — record, rewrite and rehearse difficult dreams"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^19.4.2
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.0.1
  http: ^1.4.0
  intl: any
  just_audio: ^0.9.46
  package_info_plus: ^9.0.0
  path_provider: ^2.1.6
  provider: ^6.1.5
  record: ^6.2.1
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.1
  timezone: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/
